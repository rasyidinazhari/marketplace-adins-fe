@if (isOpen) {
  <div 
    class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/60 backdrop-blur-xs animate-in fade-in duration-200"
    (click)="handleBackdropClick($event)"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="title ? 'modal-title' : null">
    
    <!-- Modal Card (Shadcn UI style) -->
    <div 
      class="relative w-full rounded-2xl border border-zinc-200 bg-white p-6 shadow-2xl transition-all animate-in zoom-in-95 duration-200 flex flex-col max-h-[90vh]"
      [ngClass]="getSizeClass()"
      (click)="stopClickPropagation($event)">
      
      <!-- Custom Header projection or default header -->
      <ng-content select="[modal-header]"></ng-content>

      @if (title || showCloseButton) {
        <div class="flex items-start justify-between gap-4 pb-4 border-b border-zinc-100">
          <div class="space-y-1">
            @if (title) {
              <h2 id="modal-title" class="text-base font-bold text-zinc-950 tracking-tight">
                {{ title }}
              </h2>
            }
            @if (description) {
              <p class="text-xs text-zinc-500 leading-relaxed">
                {{ description }}
              </p>
            }
          </div>

          @if (showCloseButton) {
            <button 
              type="button"
              (click)="closeModal()"
              class="rounded-md p-1.5 text-zinc-400 hover:text-zinc-950 hover:bg-zinc-100 transition-colors focus:outline-none focus:ring-1 focus:ring-zinc-950"
              aria-label="Tutup dialog">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          }
        </div>
      }

      <!-- Modal Body (Scrollable if content exceeds height) -->
      <div class="py-4 overflow-y-auto flex-1 text-sm text-zinc-700">
        <ng-content></ng-content>
      </div>

      <!-- Modal Footer projection -->
      <div class="modal-footer-container">
        <ng-content select="[modal-footer]"></ng-content>
      </div>

    </div>

  </div>
}
