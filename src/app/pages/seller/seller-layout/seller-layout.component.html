<app-top-navbar></app-top-navbar>

<div class="bg-zinc-50 border-b border-zinc-200/80">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <span class="text-xs text-zinc-900 font-medium">Dashboard Penjual</span>
      <div class="inline-flex items-center gap-2 rounded-full bg-white border border-zinc-200 px-3.5 py-1 text-xs font-semibold text-zinc-800 shadow-2xs">
        <span>🏪</span>
        <span>Toko: {{ storeName }}</span>
      </div>
    </div>

    <!-- Seller Sub-Navigation Tabs -->
    <div class="flex items-center gap-2 mt-4 pt-2 border-t border-zinc-200/60 overflow-x-auto">
      <a [routerLink]="['/seller/products']"
         routerLinkActive="bg-white text-zinc-950 font-semibold shadow-2xs border-zinc-200"
         [routerLinkActiveOptions]="{ exact: false }"
         class="inline-flex items-center gap-2 px-3.5 py-2 text-xs rounded-lg border border-transparent text-zinc-600 hover:text-zinc-950 hover:bg-white/60 transition-all whitespace-nowrap">
        <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        <span>Kelola Produk</span>
      </a>

      <a [routerLink]="['/seller/orders']"
         routerLinkActive="bg-white text-zinc-950 font-semibold shadow-2xs border-zinc-200"
         [routerLinkActiveOptions]="{ exact: false }"
         class="inline-flex items-center gap-2 px-3.5 py-2 text-xs rounded-lg border border-transparent text-zinc-600 hover:text-zinc-950 hover:bg-white/60 transition-all whitespace-nowrap">
        <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <span>Pesanan Masuk</span>
      </a>

      <a [routerLink]="['/seller/vouchers']"
         routerLinkActive="bg-white text-zinc-950 font-semibold shadow-2xs border-zinc-200"
         [routerLinkActiveOptions]="{ exact: false }"
         class="inline-flex items-center gap-2 px-3.5 py-2 text-xs rounded-lg border border-transparent text-zinc-600 hover:text-zinc-950 hover:bg-white/60 transition-all whitespace-nowrap">
        <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
        <span>Voucher & Promo</span>
      </a>
    </div>
  </div>
</div>

<main class="flex-1 w-full">
  <router-outlet></router-outlet>
</main>

<app-compact-footer [showCatalogLink]="false"></app-compact-footer>
