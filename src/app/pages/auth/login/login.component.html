<div
  class="min-h-screen flex flex-col justify-center items-center bg-slate-50 p-4 sm:p-8"
>
  <!-- Back to Home link -->
  <a
    [routerLink]="'/'"
    class="mb-6 inline-flex items-center gap-1.5 text-xs font-medium text-zinc-500 hover:text-zinc-950 transition-colors"
  >
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M10 19l-7-7m0 0l7-7m-7 7h18"
      />
    </svg>
    <span>Kembali ke Beranda</span>
  </a>

  <!-- Shadcn Card Container -->
  <div
    class="w-full max-w-md rounded-2xl border border-zinc-200/90 bg-white p-8 shadow-sm"
  >
    <!-- Header -->
    <div class="text-center space-y-2 mb-8">
      <img
        src="assets/warungadins-wordmark.svg"
        alt="WarungAdins"
        class="h-9 w-auto mx-auto mb-3"
      />
      <h1 class="text-2xl font-bold tracking-tight text-zinc-950">
        Selamat Datang Kembali
      </h1>
      <p class="text-xs text-zinc-500 max-w-xs mx-auto">
        Masukkan email dan kata sandi Anda untuk mengakses akun WarungAdins.
      </p>
    </div>

    <!-- Quick Role Demo Pills -->
    <div
      class="mb-6 p-3 rounded-lg bg-zinc-50 border border-zinc-200/60 text-xs"
    >
      <div
        class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wider mb-2"
      >
        Simulasi Akun Demo:
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button
          type="button"
          (click)="fillDemo('buyer')"
          class="px-2.5 py-1.5 rounded-md bg-white border border-zinc-200 text-zinc-700 hover:bg-zinc-100 font-medium transition-colors text-center"
        >
          🛒 Masuk sbg Pembeli
        </button>
        <button
          type="button"
          (click)="fillDemo('seller')"
          class="px-2.5 py-1.5 rounded-md bg-white border border-zinc-200 text-zinc-700 hover:bg-zinc-100 font-medium transition-colors text-center"
        >
          🏪 Masuk sbg Penjual
        </button>
      </div>
    </div>

    <!-- Form -->
    <form
      [formGroup]="loginForm"
      (ngSubmit)="loginForm.valid && onLoginHandler()"
      class="space-y-4"
    >
      <!-- Email Field -->
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-zinc-800">Alamat Email</label>
        <input
          formControlName="email"
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="nama@email.com"
          required
          class="flex h-10 w-full rounded-md border border-zinc-200 bg-transparent px-3 py-2 text-sm shadow-2xs placeholder:text-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-950 transition-colors"
        />
      </div>

      <!-- Password Field -->
      <div class="space-y-1.5">
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold text-zinc-800">Kata Sandi</label>
          <a
            href="#"
            class="text-xs text-zinc-500 hover:text-zinc-950 hover:underline"
            >Lupa sandi?</a
          >
        </div>
        <input
          formControlName="password"
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          class="flex h-10 w-full rounded-md border border-zinc-200 bg-transparent px-3 py-2 text-sm shadow-2xs placeholder:text-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-950 transition-colors"
        />
      </div>

      <!-- Remember me -->
      <div class="flex items-center gap-2 pt-1">
        <input
          type="checkbox"
          id="rememberMe"
          [(ngModel)]="rememberMe"
          name="rememberMe"
          class="rounded border-zinc-300 text-zinc-900 focus:ring-zinc-950 h-4 w-4"
        />
        <label
          for="rememberMe"
          class="text-xs text-zinc-600 select-none cursor-pointer"
          >Ingat saya di perangkat ini</label
        >
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full inline-flex items-center justify-center rounded-md bg-zinc-900 px-4 py-2.5 text-sm font-medium text-zinc-50 shadow-sm hover:bg-zinc-800 transition-colors disabled:opacity-50"
      >
        <span *ngIf="!isLoading">Masuk ke Akun</span>
        <span *ngIf="isLoading" class="flex items-center gap-2">
          <svg
            class="animate-spin h-4 w-4 text-white"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          Memproses...
        </span>
      </button>
    </form>

    <!-- Footer Register link -->
    <div
      class="mt-6 text-center text-xs text-zinc-500 pt-5 border-t border-zinc-100"
    >
      Belum memiliki akun WarungAdins?
      <a
        [routerLink]="'/register'"
        class="font-semibold text-zinc-950 hover:underline"
      >
        Daftar Akun Baru
      </a>
    </div>
  </div>

  <div class="mt-8 text-xs text-zinc-400">
    © 2026 WarungAdins Marketplace • Desain Bergaya shadcn/ui
  </div>
</div>
