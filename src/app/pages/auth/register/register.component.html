<div class="min-h-screen flex flex-col justify-center items-center bg-slate-50 p-4 sm:p-8">
  
  <a [routerLink]="'/'" class="mb-6 inline-flex items-center gap-1.5 text-xs font-medium text-zinc-500 hover:text-zinc-950 transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    <span>Kembali ke Beranda</span>
  </a>

  <!-- Card -->
  <div class="w-full max-w-lg rounded-2xl border border-zinc-200/90 bg-white p-8 shadow-sm">
    
    <div class="text-center space-y-2 mb-6">
      <img src="assets/warungadins-wordmark.svg" alt="WarungAdins" class="h-8 w-auto mx-auto mb-2" />
      <h1 class="text-2xl font-bold tracking-tight text-zinc-950">Buat Akun Baru</h1>
      <p class="text-xs text-zinc-500 max-w-xs mx-auto">
        Bergabung dengan komunitas pembeli dan penjual terpercaya di WarungAdins.
      </p>
    </div>

    <!-- Role Selection Tabs (Shadcn style) -->
    <div class="grid grid-cols-2 gap-2 p-1 rounded-lg bg-zinc-100 border border-zinc-200/60 mb-6 text-xs font-medium">
      <button type="button"
              (click)="role = 'buyer'"
              [class.bg-white]="role === 'buyer'"
              [class.text-zinc-950]="role === 'buyer'"
              [class.shadow-2xs]="role === 'buyer'"
              [class.font-semibold]="role === 'buyer'"
              class="py-2 rounded-md transition-all text-zinc-600 flex items-center justify-center gap-1.5">
        <span>🛒 Sebagai Pembeli</span>
      </button>
      <button type="button"
              (click)="role = 'seller'"
              [class.bg-white]="role === 'seller'"
              [class.text-zinc-950]="role === 'seller'"
              [class.shadow-2xs]="role === 'seller'"
              [class.font-semibold]="role === 'seller'"
              class="py-2 rounded-md transition-all text-zinc-600 flex items-center justify-center gap-1.5">
        <span>🏪 Buka Toko (Penjual)</span>
      </button>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-4">
      
      <!-- Full name or store name -->
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-zinc-800">
          {{ role === 'buyer' ? 'Nama Lengkap' : 'Nama Pemilik Toko' }}
        </label>
        <input type="text" 
               [(ngModel)]="fullName" 
               name="fullName"
               placeholder="Contoh: Budi Santoso" 
               required
               class="flex h-10 w-full rounded-md border border-zinc-200 bg-transparent px-3 py-2 text-sm shadow-2xs placeholder:text-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-950" />
      </div>

      <!-- If seller, store name -->
      <div *ngIf="role === 'seller'" class="space-y-1.5">
        <label class="text-xs font-semibold text-zinc-800">Nama Toko Resmi</label>
        <input type="text" 
               [(ngModel)]="storeName" 
               name="storeName"
               placeholder="Contoh: Adins Gadget Official" 
               required
               class="flex h-10 w-full rounded-md border border-zinc-200 bg-transparent px-3 py-2 text-sm shadow-2xs placeholder:text-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-950" />
      </div>

      <!-- Email & Phone in 2 cols -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-zinc-800">Email</label>
          <input type="email" 
                 [(ngModel)]="email" 
                 name="email"
                 placeholder="nama@email.com" 
                 required
                 class="flex h-10 w-full rounded-md border border-zinc-200 bg-transparent px-3 py-2 text-sm shadow-2xs placeholder:text-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-950" />
        </div>
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-zinc-800">No. WhatsApp</label>
          <input type="tel" 
                 [(ngModel)]="phone" 
                 name="phone"
                 placeholder="08123456789" 
                 required
                 class="flex h-10 w-full rounded-md border border-zinc-200 bg-transparent px-3 py-2 text-sm shadow-2xs placeholder:text-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-950" />
        </div>
      </div>

      <!-- Password & Confirm -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-zinc-800">Kata Sandi</label>
          <input type="password" 
                 [(ngModel)]="password" 
                 name="password"
                 placeholder="Min. 8 karakter" 
                 required
                 class="flex h-10 w-full rounded-md border border-zinc-200 bg-transparent px-3 py-2 text-sm shadow-2xs placeholder:text-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-950" />
        </div>
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-zinc-800">Ulangi Sandi</label>
          <input type="password" 
                 [(ngModel)]="confirmPassword" 
                 name="confirmPassword"
                 placeholder="Ulangi sandi" 
                 required
                 class="flex h-10 w-full rounded-md border border-zinc-200 bg-transparent px-3 py-2 text-sm shadow-2xs placeholder:text-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-950" />
        </div>
      </div>

      <!-- Terms Checkbox -->
      <div class="flex items-start gap-2 pt-1">
        <input type="checkbox" id="agree" [(ngModel)]="agreeTerms" name="agreeTerms" required class="mt-0.5 rounded border-zinc-300 text-zinc-900 focus:ring-zinc-950 h-4 w-4" />
        <label for="agree" class="text-xs text-zinc-600 select-none cursor-pointer leading-relaxed">
          Saya menyetujui <a href="#" class="underline text-zinc-950">Syarat & Ketentuan</a> serta <a href="#" class="underline text-zinc-950">Kebijakan Privasi</a> WarungAdins.
        </label>
      </div>

      <!-- Submit button -->
      <button type="submit" 
              [disabled]="isLoading"
              class="w-full inline-flex items-center justify-center rounded-md bg-zinc-900 px-4 py-2.5 text-sm font-medium text-zinc-50 shadow-sm hover:bg-zinc-800 transition-colors disabled:opacity-50">
        <span *ngIf="!isLoading">Daftar Akun {{ role === 'buyer' ? 'Pembeli' : 'Penjual' }}</span>
        <span *ngIf="isLoading">Mendaftarkan akun...</span>
      </button>

    </form>

    <!-- Footer Login link -->
    <div class="mt-6 text-center text-xs text-zinc-500 pt-5 border-t border-zinc-100">
      Sudah memiliki akun? 
      <a [routerLink]="'/login'" class="font-semibold text-zinc-950 hover:underline">
        Masuk di sini
      </a>
    </div>

  </div>

  <div class="mt-8 text-xs text-zinc-400">
    © 2026 WarungAdins Marketplace
  </div>

</div>
