<header *ngIf="role as currentRole" class="sticky top-0 z-50 w-full border-b border-zinc-200/80 bg-white/95 backdrop-blur supports-[backdrop-filter]:bg-white/70">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-6">
        <a [routerLink]="'/'" aria-label="WarungAdins, Beranda" class="flex items-center gap-2 transition hover:opacity-90">
          <img src="assets/warungadins-icon-symbol.svg" alt="" class="h-8 w-8 min-[420px]:hidden" />
          <img src="assets/warungadins-wordmark.svg" alt="" class="hidden h-6 w-auto object-contain min-[420px]:block sm:h-8" />
        </a>

        <!-- Desktop Navigation Links -->
        <nav class="hidden lg:flex items-center gap-1 whitespace-nowrap text-sm font-medium text-zinc-600">
          <a [routerLink]="'/'" 
             [routerLinkActiveOptions]="{exact: true}"
             routerLinkActive="text-zinc-950 font-semibold bg-zinc-100" 
             class="px-3 py-1.5 rounded-md hover:text-zinc-950 hover:bg-zinc-100/80 transition-colors">
            Beranda
          </a>
          <a *ngIf="currentRole !== 'Seller'" [routerLink]="'/products'"
             routerLinkActive="text-zinc-950 font-semibold bg-zinc-100" 
             class="px-3 py-1.5 rounded-md hover:text-zinc-950 hover:bg-zinc-100/80 transition-colors">
            Katalog Produk
          </a>

          <!-- Seller Hub Dropdown / Pill -->
          <div *ngIf="currentRole === 'Seller'" class="relative group">
            <button class="flex items-center gap-1 px-3 py-1.5 rounded-md hover:text-zinc-950 hover:bg-zinc-100/80 transition-colors">
              <span>Area Penjual</span>
              <svg class="w-4 h-4 text-zinc-400 group-hover:rotate-180 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </button>
            <div class="absolute left-0 mt-1 w-52 rounded-lg border border-zinc-200 bg-white p-1 shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible group-focus-within:opacity-100 group-focus-within:visible transition-all duration-150 z-50">
              <div class="px-2 py-1.5 text-xs font-semibold text-zinc-400 uppercase tracking-wider">Dashboard Toko</div>
              <a [routerLink]="'/seller/products'" class="flex items-center gap-2 rounded-md px-2.5 py-2 text-xs font-medium text-zinc-700 hover:bg-zinc-100 hover:text-zinc-950 transition-colors">
                <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                Kelola Produk
              </a>
              <a [routerLink]="'/seller/orders'" class="flex items-center gap-2 rounded-md px-2.5 py-2 text-xs font-medium text-zinc-700 hover:bg-zinc-100 hover:text-zinc-950 transition-colors">
                <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                Pesanan Masuk
              </a>
              <a [routerLink]="'/seller/vouchers'" class="flex items-center gap-2 rounded-md px-2.5 py-2 text-xs font-medium text-zinc-700 hover:bg-zinc-100 hover:text-zinc-950 transition-colors">
                <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
                Voucher & Promo
              </a>
            </div>
          </div>
        </nav>
      </div>

      <!-- Search Bar (Shadcn style with subtle keycap) -->
      <div *ngIf="currentRole !== 'Seller'" class="hidden lg:flex min-w-0 flex-1 max-w-md items-center">
        <div class="relative w-full">
          <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-zinc-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>
          <input type="text" 
                 placeholder="Cari kebutuhanmu di WarungAdins..." 
                 class="w-full pl-9 pr-12 py-1.5 text-sm bg-zinc-100/70 hover:bg-zinc-100 focus:bg-white text-zinc-900 placeholder:text-zinc-400 rounded-md border border-transparent focus:border-zinc-300 focus:outline-none focus:ring-1 focus:ring-zinc-950 transition-all" />
          <div class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none">
            <kbd class="hidden lg:inline-block px-1.5 py-0.5 text-[10px] font-semibold text-zinc-400 bg-white border border-zinc-200 rounded shadow-2xs">⌘K</kbd>
          </div>
        </div>
      </div>

      <!-- Action Items: Cart, Orders, Auth -->
      <div class="flex items-center gap-2">
        
        <!-- Cart Button -->
        <a *ngIf="currentRole === 'Buyer'" [routerLink]="'/cart'"
           class="relative inline-flex items-center justify-center p-2 rounded-md text-zinc-600 hover:text-zinc-950 hover:bg-zinc-100 transition-colors"
           title="Keranjang Belanja">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
        </a>

        <!-- Buyer Orders Link -->
        <a *ngIf="currentRole === 'Buyer'" [routerLink]="'/buyer/orders'"
           class="hidden lg:inline-flex items-center gap-1.5 whitespace-nowrap px-3 py-1.5 text-sm font-medium text-zinc-600 hover:text-zinc-950 hover:bg-zinc-100 rounded-md transition-colors"
           title="Riwayat Pesanan">
          <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <span>Pesanan Saya</span>
        </a>

        <!-- Auth Buttons -->
        <a *ngIf="currentRole === 'Guest'" [routerLink]="'/buyer/login'"
           class="inline-flex items-center justify-center px-3 py-1.5 text-sm font-medium text-zinc-700 hover:text-zinc-950 hover:bg-zinc-100 rounded-md transition-colors">
          Masuk
        </a>
        <a *ngIf="currentRole === 'Guest'" [routerLink]="'/register'"
           class="inline-flex items-center justify-center px-3.5 py-1.5 text-sm font-medium text-zinc-50 bg-zinc-900 hover:bg-zinc-800 rounded-md shadow-xs transition-colors">
          Daftar
        </a>

        <div *ngIf="currentRole !== 'Guest'" #accountMenu class="relative"
             (keydown.escape)="isAccountMenuOpen = false; accountButton.focus()">
          <button #accountButton type="button" [attr.aria-expanded]="isAccountMenuOpen"
                  aria-controls="navbar-account-panel" (click)="toggleAccountMenu()"
                  class="flex items-center gap-1.5 rounded-md px-2 py-1.5 text-sm font-medium text-zinc-700 transition-colors hover:bg-zinc-100 hover:text-zinc-950 sm:px-3">
            <svg aria-hidden="true" class="h-4 w-4 shrink-0 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z" />
            </svg>
            <span class="max-w-[6rem] truncate sm:max-w-[8rem]" [title]="accountName">{{ accountName }}</span>
            <svg aria-hidden="true" [class.rotate-180]="isAccountMenuOpen" class="h-4 w-4 shrink-0 text-zinc-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          <div id="navbar-account-panel" [hidden]="!isAccountMenuOpen"
               class="absolute right-0 z-50 mt-1 w-40 rounded-lg border border-zinc-200 bg-white p-1 shadow-lg">
            <button type="button" (click)="logout()"
                    class="flex w-full items-center gap-2 rounded-md px-2.5 py-2 text-left text-xs font-medium text-zinc-700 transition-colors hover:bg-zinc-100 hover:text-zinc-950">
              <svg aria-hidden="true" class="h-4 w-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 17l5-5-5-5m5 5H3m9-8h7a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-7" />
              </svg>
              Keluar
            </button>
          </div>
        </div>

        <!-- Mobile Menu Toggle Button -->
        <button type="button" aria-label="Menu navigasi" [attr.aria-expanded]="isMobileMenuOpen" (click)="toggleMobileMenu()" class="lg:hidden inline-flex items-center justify-center p-2 rounded-md text-zinc-600 hover:text-zinc-950 hover:bg-zinc-100">
          <svg *ngIf="!isMobileMenuOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          <svg *ngIf="isMobileMenuOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown Navigation -->
  <div *ngIf="isMobileMenuOpen" class="lg:hidden border-t border-zinc-200 bg-white px-4 pt-3 pb-5 space-y-3">
    <div *ngIf="currentRole !== 'Seller'" class="relative w-full">
      <input type="text" placeholder="Cari barang..." class="w-full px-3 py-2 text-sm bg-zinc-100 rounded-md border border-zinc-200 focus:outline-none" />
    </div>
    <div class="grid grid-cols-2 gap-2 text-sm font-medium">
      <a [routerLink]="'/'" (click)="isMobileMenuOpen=false" class="p-2 rounded-md hover:bg-zinc-100 text-zinc-700">Beranda</a>
      <a *ngIf="currentRole !== 'Seller'" [routerLink]="'/products'" (click)="isMobileMenuOpen=false" class="p-2 rounded-md hover:bg-zinc-100 text-zinc-700">Katalog Produk</a>
      <a *ngIf="currentRole === 'Buyer'" [routerLink]="'/cart'" (click)="isMobileMenuOpen=false" class="p-2 rounded-md hover:bg-zinc-100 text-zinc-700">Keranjang</a>
      <a *ngIf="currentRole === 'Buyer'" [routerLink]="'/buyer/orders'" (click)="isMobileMenuOpen=false" class="p-2 rounded-md hover:bg-zinc-100 text-zinc-700">Pesanan Saya</a>
    </div>
    <div *ngIf="currentRole === 'Seller'" class="border-t border-zinc-100 pt-2">
      <p class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1">Area Penjual</p>
      <div class="grid grid-cols-3 gap-1 text-xs">
        <a [routerLink]="'/seller/products'" (click)="isMobileMenuOpen=false" class="p-2 rounded-md hover:bg-zinc-100 text-zinc-700 text-center border border-zinc-100">Produk</a>
        <a [routerLink]="'/seller/orders'" (click)="isMobileMenuOpen=false" class="p-2 rounded-md hover:bg-zinc-100 text-zinc-700 text-center border border-zinc-100">Pesanan</a>
        <a [routerLink]="'/seller/vouchers'" (click)="isMobileMenuOpen=false" class="p-2 rounded-md hover:bg-zinc-100 text-zinc-700 text-center border border-zinc-100">Voucher</a>
      </div>
    </div>
  </div>
</header>
